version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: cscc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cscc
      POSTGRES_PASSWORD: cscc_password
      POSTGRES_DB: cscc_db
    ports:
      - "5432:5432"
    volumes:
      - cscc_pgdata:/var/lib/postgresql/data

volumes:
  cscc_pgdata:

